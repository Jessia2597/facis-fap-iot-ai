apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: facis-ingress-uibuilder-vendor
  namespace: orce
  annotations:
    # Strip /orce/ from /orce/uibuilder/vendor/* so it reaches UIBUILDER's
    # actual socket.io + client-lib mount at /uibuilder/vendor/*.
    #
    # Why a SEPARATE ingress for just /vendor/: the rest of /orce/uibuilder/*
    # (uibindex, instance/<url>, admin/*) maps to Node-RED's admin handler
    # which is rooted at httpAdminRoot=/orce — those paths MUST keep their
    # /orce/ prefix. Only /orce/uibuilder/vendor/* needs stripping because
    # it's served by UIBUILDER's httpNode handler at /uibuilder/vendor/*.
    #
    # The SPA's UIBUILDER client lib (uibuilder.iife.js) computes its socket
    # path as `${httpNodeRoot}/uibuilder/vendor/socket.io` and derives
    # httpNodeRoot from the page URL — when loaded at /orce/aiInsight/, that
    # becomes /orce/uibuilder/vendor/socket.io. Hence the need for this
    # rewrite.
    nginx.ingress.kubernetes.io/rewrite-target: /uibuilder/vendor/$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: fap-iotai.facis.cloud
      http:
        paths:
          - path: /orce/uibuilder/vendor(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: orce
                port:
                  number: 1880
  tls:
    - hosts:
        - fap-iotai.facis.cloud
      secretName: facis-wild
