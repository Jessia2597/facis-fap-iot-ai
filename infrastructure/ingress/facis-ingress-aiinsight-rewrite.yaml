apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: facis-ingress-aiinsight-rewrite
  namespace: orce
  annotations:
    # Reverse-proxy /orce/aiInsight/<rest> → /aiInsight/<rest>
    # AND        /orce/uibuilder/<rest> → /uibuilder/<rest>
    # at the Node-RED Express layer.
    #
    # Why two rewrites in one ingress: UIBUILDER mounts under httpNodeRoot
    # (default '/'), so the SPA serves at /aiInsight/ and the shared UIBUILDER
    # client lib + Socket.IO endpoint serve at /uibuilder/vendor/. We expose
    # both at /orce/aiInsight/ + /orce/uibuilder/ to match the standard FACIS
    # URL scheme. httpNodeRoot itself cannot be set to /orce because that
    # would break /api/v1/, /ai/, /dsp/ endpoints.
    #
    # The capture groups are: $1 = "aiInsight" or "uibuilder", $2 = / or
    # empty, $3 = rest of path. Rewrite preserves $1 and $3, dropping the
    # /orce/ prefix.
    nginx.ingress.kubernetes.io/rewrite-target: /$1/$3
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: fap-iotai.facis.cloud
      http:
        paths:
          - path: /orce/(aiInsight|uibuilder)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: orce
                port:
                  number: 1880
  tls:
    - hosts:
        - fap-iotai.facis.cloud
      secretName: facis-wild
