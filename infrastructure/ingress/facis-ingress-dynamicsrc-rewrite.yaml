apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: facis-ingress-dynamicsrc-rewrite
  namespace: orce
  annotations:
    # ─── EDITOR-ONLY rewrite (NOT the SPA) ────────────────────────────────
    #
    # Strip the /orce prefix so /orce/dynamicsrc/<file> reaches the ORCE
    # pod's static handler at /dynamicsrc/<file>.
    #
    # Scope: this rewrite is required ONLY by the customised Node-RED
    # editor at /orce/# (theme assets — Manrope/Poppins fonts and node
    # icons). The AI Insight UI SPA does not use /dynamicsrc/ at all
    # (verified: services/ai-insight-ui/ui/app/index.html has no such
    # reference; vite.config.ts uses base='/orce/aiInsight/').
    #
    # Why it can't be removed:
    # The colleague's customised editor (red.min.js + theme/scripts/
    # guided-script.js + theme/css/guided-style.css) hardcodes RELATIVE
    # asset paths like "dynamicsrc/images/nodes/common/info-icon.svg" and
    # constructs font URLs as ${window.location.origin +
    # window.location.pathname} + "dynamicsrc/...". When the editor is
    # mounted under /orce/ those resolve to /orce/dynamicsrc/... which
    # 404s — Node-RED's static handler maps /data > / (root), not /orce.
    # The shipped red.min.js lives under /opt/maestro/... which is
    # read-only in the running container, so we can't patch the file in
    # place. This Ingress rewrite restores the URLs the editor expects
    # without modifying anything inside the pod.
    #
    # Reviewer note (Hossein PR review §B.2 / C.4): this rewrite is
    # specifically NOT a workaround for the SPA's URL scheme. The SPA
    # serves cleanly at /orce/aiInsight/ with the standard
    # facis-ingress-aiinsight-rewrite.yaml. Removing this dynamicsrc
    # rewrite breaks editor visuals (fallback fonts, missing node icons)
    # but does not affect the application. Documented in
    # services/ai-insight-ui/docs/deployment/orce-native-runbook.md.
    nginx.ingress.kubernetes.io/rewrite-target: /dynamicsrc/$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fap-iotai.facis.cloud
      secretName: facis-wild
  rules:
    - host: fap-iotai.facis.cloud
      http:
        paths:
          - path: /orce/dynamicsrc(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: orce
                port:
                  number: 1880
